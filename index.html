
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GVP</title>

  <!-- Ícones -->
  <link rel="apple-touch-icon" sizes="180x180" href="./GVP_Icon_Hospital_192.png">
  <link rel="icon" type="image/png" href="./GVP_Icon_Hospital_192.png">

  <!-- O manifest será injetado apenas no Android -->

  <!-- Configurações PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Visitas">
  <meta name="theme-color" content="#0078D7">

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffffff;
    }

    img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      margin-top: 20px;
    }

    h1 {
      margin-top: 15px;
      margin-bottom: 20px;
      color: #0078D7;
      font-size: 30px;
    }

    .instrucao {
      margin: 25px auto 0;
      max-width: 360px;
      padding: 18px;
      border-radius: 12px;
      background: #f2f2f2;
      color: #333333;
      font-size: 19px;
      line-height: 1.5;
      font-weight: bold;
    }

    .observacao {
      margin: 18px auto 0;
      max-width: 360px;
      color: #666666;
      font-size: 16px;
      line-height: 1.4;
    }

    .btn-pc {
      display: none;
      margin: 30px auto 0;
      padding: 15px 30px;
      background: #0078D7;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      max-width: 300px;
    }

    .btn-pc:hover {
      background: #005BB5;
    }
  </style>

  <script>
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    const urlGVP = "https://script.google.com/macros/s/AKfycbx6wW5b5yKpzJSJEw04q-7Cx9uct8fvlHR4ifgEZVYPhT3AQuDjXwHrZ9fT47YzMRiT/exec";

    // Lê o token da URL.
    let token = new URLSearchParams(window.location.search).get("d");

    // Aceita somente tokens no formato UUID v4.
    const tokenValido = valor =>
      /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(valor || "");

    // Recupera ou salva o token no iOS e no Android.
    try {
      if (tokenValido(token)) {
        localStorage.setItem("gvp_token", token);
      } else {
        const tokenSalvo = localStorage.getItem("gvp_token");
        token = tokenValido(tokenSalvo) ? tokenSalvo : null;
      }
    } catch (e) {
      console.log("Armazenamento local indisponível.");
      if (!tokenValido(token)) token = null;
    }

    // Monta o endereço do Apps Script.
    let urlFinal = urlGVP;

    if (token) {
      urlFinal += "?d=" + encodeURIComponent(token);
    }

    // Manifest apenas no Android.
    if (isAndroid) {
      const manifest = document.createElement("link");
      manifest.rel = "manifest";
      manifest.href = "./manifest.json";
      document.head.appendChild(manifest);
    }

    function abrirGVPSeInstalado() {
      const standalone =
        window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches;

      if (standalone) {
        window.location.replace(urlFinal);
        return;
      }

      const btn = document.getElementById("btnAcessar");

      if (!btn) return;

      btn.href = urlFinal;

      if (!isIOS && !isAndroid) {
        btn.style.display = "inline-block";
        btn.textContent = "Acessar o Sistema";
        document.querySelector(".instrucao").style.display = "none";
        document.querySelector(".observacao").style.display = "none";
      } else if (isAndroid) {
        btn.style.display = "inline-block";
        btn.textContent = "Abrir o GVP";
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", abrirGVPSeInstalado);
    } else {
      abrirGVPSeInstalado();
    }

    // Service worker apenas no Android.
    if (isAndroid && "serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .catch(e => console.log("Erro no service worker:", e));
      });
    }
  </script>
</head>

<body>
  <img src="./GVP_Icon_Hospital_192.png" alt="Ícone GVP">

  <h1>GVP</h1>

  <div class="instrucao">
    Toque em <b>Compartilhar</b> e escolha<br>
    "Adicionar à Tela de Início".
  </div>

  <div class="observacao">
    Depois, toque no ícone GVP que será criado na Tela de Início para acessar o sistema.
  </div>

  <a href="#" id="btnAcessar" class="btn-pc">Acessar o Sistema</a>
</body>
</html>
