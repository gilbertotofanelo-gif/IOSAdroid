  <script>
    const urlGVP = "https://script.google.com/macros/s/AKfycbx6wW5b5yKpzJSJEw04q-7Cx9uct8fvlHR4ifgEZVYPhT3AQuDjXwHrZ9fT47YzMRiT/exec";
    
    // Pega o token da URL (?d=...)
    const urlParams = new URLSearchParams(window.location.search);
    let token = urlParams.get("d");

    // Se veio token novo na URL, salva no celular (útil para o Android)
    if (token) {
      localStorage.setItem("gvp_token", token);
    } else {
      // Se não veio, tenta resgatar o token salvo
      token = localStorage.getItem("gvp_token");
    }

    let urlFinal = urlGVP;
    if (token) {
      urlFinal += "?d=" + encodeURIComponent(token);
    }

    // 🔥 1. LÓGICA EXATA DO IOS (Redirecionamento imediato, sem esperar carregar)
    if (window.navigator.standalone === true) {
      window.location.replace(urlFinal);
    }

    window.addEventListener("DOMContentLoaded", function () {
      const isAndroid = /Android/i.test(navigator.userAgent);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      const standalone = window.matchMedia("(display-mode: standalone)").matches;

      const btn = document.getElementById("btnAcessar");
      const instrucao = document.querySelector(".instrucao");
      const observacao = document.querySelector(".observacao");

      btn.href = urlFinal;

      // 🔥 2. LÓGICA PARA ANDROID (PWA instalado)
      if (standalone && isAndroid) {
        window.location.replace(urlFinal);
        setTimeout(function () {
          btn.style.display = "inline-block";
          btn.textContent = "Abrir o GVP";
        }, 4000);
        return;
      }

      // Android no navegador: mostra botão
      if (isAndroid) {
        btn.style.display = "inline-block";
        btn.textContent = "Abrir o GVP";
        return;
      }

      // Computador: mostra botão
      if (!isIOS) {
        btn.style.display = "inline-block";
        btn.textContent = "Acessar o Sistema";
        instrucao.style.display = "none";
        observacao.style.display = "none";
      }
    });

    // 🔥 3. SERVICE WORKER APENAS NO ANDROID
    // O iOS tem bugs com SW + redirecionamento externo. Como o iOS não precisa dele, vamos bloquear.
    if ("serviceWorker" in navigator && /Android/i.test(navigator.userAgent)) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .then(function (registro) {
            console.log("Service Worker registrado (Android):", registro.scope);
          })
          .catch(function (erro) {
            console.error("Erro ao registrar Service Worker:", erro);
          });
      });
    }
  </script>
