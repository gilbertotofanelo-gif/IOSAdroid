
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GVP</title>

  <!-- Ícones -->
  <link rel="apple-touch-icon" sizes="180x180"
        href="https://gilbertotofanelo-gif.github.io/IOSAdroid/GVP_Icon_Hospital_192.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192"
        href="https://gilbertotofanelo-gif.github.io/IOSAdroid/GVP_Icon_Hospital_192.png?v=2">

  <!-- Configurações iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Visitas">
  <meta name="theme-color" content="#0078D7">

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffffff;
    }

    img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      margin-top: 20px;
    }

    h1 {
      margin-top: 15px;
      margin-bottom: 20px;
      color: #0078D7;
      font-size: 30px;
    }

    .instrucao {
      margin: 25px auto 0;
      max-width: 360px;
      padding: 18px;
      border-radius: 12px;
      background: #f2f2f2;
      color: #333333;
      font-size: 19px;
      line-height: 1.5;
      font-weight: bold;
    }

    .observacao {
      margin: 18px auto 0;
      max-width: 360px;
      color: #666666;
      font-size: 16px;
      line-height: 1.4;
    }

    .btn-pc {
      display: none;
      margin: 30px auto 0;
      padding: 15px 30px;
      background: #0078D7;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      max-width: 300px;
    }

    .btn-pc:hover {
      background: #005BB5;
    }

    .aviso-token {
      display: none;
      margin: 25px auto;
      max-width: 360px;
      padding: 16px;
      border-radius: 10px;
      background: #fff3cd;
      color: #664d03;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>

  <script>
    const urlGVP =
      "https://script.google.com/macros/s/AKfycbx6wW5b5yKpzJSJEw04q-7Cx9uct8fvlHR4ifgEZVYPhT3AQuDjXwHrZ9fT47YzMRiT/exec";

    const urlPagina =
      "https://gilbertotofanelo-gif.github.io/IOSAdroid/";

    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isMobile = isIOS || isAndroid;

    function tokenValido(token) {
      return /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(String(token || "").trim());
    }

    /*
     * Recupera o token existente.
     * Nunca gera um UUID novo neste launcher.
     */
    function obterToken() {
      const params = new URLSearchParams(window.location.search);
      const tokenURL = params.get("d");

      if (tokenValido(tokenURL)) {
        try {
          localStorage.setItem("gvp_device", tokenURL);
        } catch (e) {}

        return tokenURL;
      }

      try {
        const tokenSalvo = localStorage.getItem("gvp_device");

        if (tokenValido(tokenSalvo)) {
          return tokenSalvo;
        }
      } catch (e) {
        console.log("Não foi possível ler o token local.");
      }

      return null;
    }

    const token = obterToken();

    /*
     * Só monta o endereço do aplicativo com um token válido.
     */
    const urlFinal = token
      ? urlGVP + "?d=" + encodeURIComponent(token)
      : null;

    /*
     * Configuração exclusiva para Android.
     */
    if (isAndroid) {
      const manifest = document.createElement("link");
      manifest.rel = "manifest";
      manifest.href = "./manifest.json";
      document.head.appendChild(manifest);

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js")
            .catch(function (erro) {
              console.log("Service Worker:", erro);
            });
        });
      }
    }

    window.addEventListener("DOMContentLoaded", function () {
      const standaloneIOS = window.navigator.standalone === true;

      const standaloneAndroid =
        window.matchMedia("(display-mode: standalone)").matches;

      const standalone = standaloneIOS || standaloneAndroid;

      const btn = document.getElementById("btnAcessar");
      const instrucao = document.querySelector(".instrucao");
      const observacao = document.querySelector(".observacao");
      const aviso = document.getElementById("avisoToken");

      /*
       * Se o ícone instalado abrir sem token recuperável,
       * não redireciona para o GAS sem identificação.
       */
      if (!token) {
        if (standalone) {
          aviso.style.display = "block";
          aviso.textContent =
            "Não foi possível recuperar o código deste celular. " +
            "Não será criado outro código automaticamente. " +
            "Abra o GVP pelo link personalizado que você recebeu " +
            "ao escolher “Lembrar neste celular”.";
          instrucao.style.display = "none";
          observacao.style.display = "none";
        } else {
          aviso.style.display = "block";
          aviso.textContent =
            "Este acesso não contém o código personalizado do aparelho. " +
            "Abra o link personalizado do GVP para manter seu nome salvo.";
        }

        return;
      }

      btn.href = urlFinal;

      /*
       * Ao abrir pelo ícone instalado, usa o mesmo token.
       */
      if (standalone) {
        window.location.replace(urlFinal);
        return;
      }

      /*
       * No computador ou no navegador Android, mostra o botão.
       */
      if (!isMobile || isAndroid) {
        btn.style.display = "inline-block";

        if (!isMobile) {
          btn.textContent = "Acessar o Sistema";
          instrucao.style.display = "none";
          observacao.style.display = "none";
        } else {
          btn.textContent = "Abrir o GVP";
        }
      }
    });
  </script>
</head>

<body>
  <img
    src="https://gilbertotofanelo-gif.github.io/IOSAdroid/GVP_Icon_Hospital_192.png"
    alt="Ícone GVP">

  <h1>GVP</h1>

  <div class="instrucao">
    Toque em <b>Compartilhar</b> e escolha<br>
    "Adicionar à Tela de Início".
  </div>

  <div class="observacao">
    Depois, toque no ícone GVP criado na Tela de Início para acessar o sistema.
  </div>

  <div id="avisoToken" class="aviso-token"></div>

  <a href="#" id="btnAcessar" class="btn-pc">
    Acessar o Sistema
  </a>
</body>
</html>
